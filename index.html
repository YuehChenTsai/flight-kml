<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈ Flight Path to KML</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@photostructure/tz-lookup/tz.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--accent:#38bdf8;--accent-hover:#7dd3fc;--text:#e2e8f0;--text-dim:#94a3b8;--success:#4ade80;--warn:#fbbf24;--danger:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}
.container{max-width:900px;margin:auto}
header{text-align:center;padding:1.5rem 0 1rem}
header h1{font-size:1.6rem;color:var(--accent)}
header p{color:var(--text-dim);font-size:.85rem;margin-top:.3rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:.95rem;font-weight:600;color:var(--accent);margin-bottom:1rem;display:flex;align-items:center;gap:.4rem}
.notice{padding:.75rem 1rem;border-radius:8px;margin-bottom:.75rem;font-size:.82rem;line-height:1.6}
.notice.warn{background:#1a1a2e;border-left:3px solid var(--warn);color:var(--warn)}
.notice.info{background:#0f2a3e;border-left:3px solid var(--accent);color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.form-group{display:flex;flex-direction:column;gap:.3rem}
label{font-size:.82rem;color:var(--text-dim)}
select,input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.55rem .75rem;border-radius:8px;font-size:.9rem}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.btn-row{margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap}
button{padding:.6rem 1.2rem;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:.4rem}
.btn-primary{background:var(--accent);color:var(--bg);font-weight:600}
.btn-primary:hover{background:var(--accent-hover)}
.btn-success{background:var(--success);color:var(--bg);font-weight:600}
.btn-success:hover{background:#86efac}
button:disabled{opacity:.4;cursor:not-allowed}
#status{margin-top:.75rem;font-size:.82rem;min-height:1.2rem;color:var(--text-dim)}
#status.error{color:var(--danger)}
#status.ok{color:var(--success)}
#status.loading{color:var(--warn)}
.flight-info-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:1rem;font-size:.85rem;line-height:1.8}
.flight-info-box strong{color:var(--accent)}
#map{height:420px;border-radius:8px;border:1px solid var(--border);margin-bottom:.75rem}
.alt-selector{font-size:.82rem;color:var(--text-dim);margin-bottom:.75rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.alt-selector label{display:flex;align-items:center;gap:.3rem;cursor:pointer}
.hidden{display:none!important}
.leaflet-container{background:#0c1222!important}
.leg-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem;max-height:400px;overflow-y:auto}
.leg-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;cursor:pointer;transition:border-color .2s}
.leg-item:hover,.leg-item.active{border-color:var(--accent)}
.leg-item.active{background:#0f2a3e}
.leg-item-title{font-weight:600;color:var(--accent);font-size:.9rem;margin-bottom:.3rem}
.leg-item-meta{font-size:.78rem;color:var(--text-dim);line-height:1.7}
.leg-item-meta .local-time{color:var(--text);font-weight:500}
.leg-item-meta .utc-time{color:var(--text-dim);font-style:italic}
.leg-item-meta .leg-stats{color:var(--text-dim);margin-top:.2rem}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>✈ Flight Path to KML</h1>
    <p>即時查詢航班軌跡，預覽並匯出為 KML 檔案</p>
  </header>

  <div class="notice info">
    ℹ 資料來源：<strong>airplanes.live</strong> 社群即時 ADS-B 資料。僅能查詢<strong>目前正在飛行或近期有資料</strong>的航班。
  </div>
  <div class="notice warn">
    ⚠ 輸入 <strong>ICAO Hex</strong>（如 8991be）、<strong>航班呼號</strong>（如 CAL130）或<strong>機身註冊號</strong>（如 B-18317）即可搜尋。
  </div>

  <div class="card">
    <div class="card-title">🔍 查詢航班</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="queryType">查詢方式</label>
        <select id="queryType">
          <option value="hex">ICAO Hex（如 8991be）</option>
          <option value="callsign">航班呼號（如 CAL130）</option>
          <option value="reg">機身註冊號（如 B-18317）</option>
        </select>
      </div>
      <div class="form-group">
        <label for="queryValue">查詢值</label>
        <input type="text" id="queryValue" placeholder="輸入代碼…">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btnSearch" onclick="searchAircraft()">🔍 搜尋航班</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="card-title">📡 航班資訊</div>
    <div class="flight-info-box" id="flightInfo"></div>

    <div class="card-title">✂ 偵測到的航段（點選以預覽）</div>
    <div class="leg-list" id="legList"></div>

    <div class="card-title">🗺 航班軌跡</div>
    <div id="map"></div>

    <div class="alt-selector">
      <strong>KML 高度模式：</strong>
      <label><input type="radio" name="altMode" value="geom" checked> 幾何高度 (GPS)</label>
      <label><input type="radio" name="altMode" value="baro"> 氣壓高度</label>
    </div>
    <div class="btn-row">
      <button class="btn-success" id="btnDownload" onclick="downloadKML()">📥 下載此航段 KML</button>
      <button class="btn-primary" id="btnDownloadAll" onclick="downloadAllKML()">📦 下載全部航段 KML</button>
    </div>
  </div>
</div>

<script>
/* ===== 全域設定 ===== */
var ADSB_API = 'https://api.airplanes.live/v2';
var TRACE_PROXY = '/api/traces';

var currentTrace = null;
var currentMeta = null;
var currentLegs = [];
var selectedLegIndex = 0;
var map = null;
var trackLayer = null;

/* ===== 工具函式 ===== */
function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = type || '';
}

function fmtTimeUTC(unix) {
  if (!unix) return '?';
  return new Date(unix * 1000).toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
}

function fmtTimeLocal(unix, tzName) {
  if (!unix || !tzName) return '?';
  try {
    var d = new Date(unix * 1000);
    var opts = {
      timeZone: tzName,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit',
      hour12: false
    };
    var formatted = new Intl.DateTimeFormat('sv-SE', opts).format(d);
    var abbr = getTzAbbr(d, tzName);
    return formatted + ' ' + abbr;
  } catch (e) {
    return fmtTimeUTC(unix);
  }
}

function getTzAbbr(date, tzName) {
  try {
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: tzName,
      timeZoneName: 'short'
    }).formatToParts(date);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].type === 'timeZoneName') return parts[i].value;
    }
  } catch (e) {}
  return tzName;
}

function lookupTz(lat, lon) {
  try {
    if (typeof tzlookup === 'function') return tzlookup(lat, lon);
  } catch (e) {}
  return 'UTC';
}

function fmtDuration(seconds) {
  var h = Math.floor(seconds / 3600);
  var m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

function ftToM(ft) {
  if (ft === null || ft === undefined || ft === 'ground') return 0;
  return ft * 0.3048;
}

function getAltM(pt, useGeom) {
  var altGeom = pt[10];
  var altBaro = pt[3];
  if (useGeom && altGeom !== null && altGeom !== undefined) return ftToM(altGeom);
  if (altBaro !== null && altBaro !== undefined && altBaro !== 'ground') return ftToM(altBaro);
  return 0;
}

/* ===== 航段切分：使用 flags & 2 (new leg) ===== */
function splitLegs(trace) {
  var points = trace.trace;
  var baseTs = trace.timestamp;
  if (!points || points.length === 0) return [];

  var valid = [];
  for (var i = 0; i < points.length; i++) {
    if (points[i][1] !== null && points[i][2] !== null) {
      valid.push(points[i]);
    }
  }
  if (valid.length === 0) return [];

  var legs = [];
  var currentLeg = [valid[0]];

  for (var j = 1; j < valid.length; j++) {
    var flags = valid[j][6] || 0;
    var isNewLeg = (flags & 2) > 0;

    if (isNewLeg) {
      if (currentLeg.length > 0) {
        legs.push(currentLeg);
      }
      currentLeg = [valid[j]];
    } else {
      currentLeg.push(valid[j]);
    }
  }
  if (currentLeg.length > 0) {
    legs.push(currentLeg);
  }

  // 過濾：剔除最大高度 < 2000ft 且點數 < 50 的片段（純地面移動）
  var filtered = [];
  for (var k = 0; k < legs.length; k++) {
    var leg = legs[k];
    var maxAlt = 0;
    for (var m = 0; m < leg.length; m++) {
      var a = leg[m][3];
      if (a !== null && a !== undefined && a !== 'ground' && a > maxAlt) maxAlt = a;
      var ag = leg[m][10];
      if (ag !== null && ag !== undefined && ag > maxAlt) maxAlt = ag;
    }
    if (maxAlt > 2000 || leg.length >= 50) {
      filtered.push(leg);
    }
  }

  return filtered;
}

function getLegCallsign(leg) {
  var counts = {};
  var best = '';
  var bestCount = 0;
  for (var i = 0; i < leg.length; i++) {
    var detail = leg[i][8];
    if (detail && detail.flight) {
      var cs = detail.flight.trim();
      if (!cs) continue;
      counts[cs] = (counts[cs] || 0) + 1;
      if (counts[cs] > bestCount) {
        bestCount = counts[cs];
        best = cs;
      }
    }
  }
  return best;
}

function getLegMaxAlt(leg) {
  var max = 0;
  for (var i = 0; i < leg.length; i++) {
    var a = leg[i][10] || leg[i][3];
    if (a !== null && a !== undefined && a !== 'ground' && a > max) max = a;
  }
  return max;
}

/* ===== 搜尋航班 ===== */
async function searchAircraft() {
  var qType = document.getElementById('queryType').value;
  var qVal = document.getElementById('queryValue').value.trim();
  if (!qVal) { setStatus('請輸入查詢值', 'error'); return; }

  setStatus('正在搜尋…', 'loading');
  document.getElementById('btnSearch').disabled = true;
  document.getElementById('resultCard').classList.add('hidden');

  try {
    var endpoint;
    if (qType === 'hex') endpoint = ADSB_API + '/hex/' + qVal.toLowerCase();
    else if (qType === 'callsign') endpoint = ADSB_API + '/callsign/' + qVal.toUpperCase();
    else endpoint = ADSB_API + '/reg/' + qVal.toUpperCase();

    var resp = await fetch(endpoint);
    if (!resp.ok) throw new Error('API 回應錯誤：' + resp.status);
    var data = await resp.json();

    if (!data.ac || data.ac.length === 0) {
      setStatus('未找到該航班（可能目前未在飛行或查詢值有誤）', 'error');
      return;
    }

    var ac = data.ac[0];
    var hex = ac.hex;
    if (!hex) { setStatus('找到航班但無 ICAO hex', 'error'); return; }

    currentMeta = {
      hex: hex,
      callsign: (ac.flight || '').trim(),
      reg: ac.r || '',
      type: ac.t || '',
      desc: ac.desc || ''
    };

    setStatus('找到航班 ' + hex + '，正在載入軌跡…', 'loading');
    await loadTrace(hex);
  } catch (e) {
    setStatus('搜尋失敗：' + e.message, 'error');
  } finally {
    document.getElementById('btnSearch').disabled = false;
  }
}

/* ===== 載入軌跡 ===== */
async function loadTrace(hex) {
  var suffix = hex.slice(-2).toLowerCase();
  var urls = [
    TRACE_PROXY + '/' + suffix + '/trace_full_' + hex.toLowerCase() + '.json',
    TRACE_PROXY + '/' + suffix + '/trace_recent_' + hex.toLowerCase() + '.json'
  ];

  var traceData = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var resp = await fetch(urls[i]);
      if (resp.ok) {
        var text = await resp.text();
        if (text && text.length > 10) {
          traceData = JSON.parse(text);
          if (traceData && traceData.trace && traceData.trace.length > 0) break;
          traceData = null;
        }
      }
    } catch (e) { /* 繼續 */ }
  }

  if (!traceData || !traceData.trace || traceData.trace.length === 0) {
    setStatus('找到航班但無可用軌跡資料', 'error');
    return;
  }

  currentTrace = traceData;
  currentLegs = splitLegs(traceData);

  if (currentLegs.length === 0) {
    setStatus('軌跡資料中未偵測到有效航段', 'error');
    return;
  }

  setStatus('已載入軌跡，偵測到 ' + currentLegs.length + ' 個航段', 'ok');
  renderFlightInfo();
  renderLegList();
  selectLeg(0);
  document.getElementById('resultCard').classList.remove('hidden');
  setTimeout(function() { if (map) map.invalidateSize(); }, 300);
}

/* ===== 顯示航班資訊 ===== */
function renderFlightInfo() {
  var m = currentMeta;
  var t = currentTrace;
  var html = '';
  html += '<strong>ICAO：</strong>' + (t.icao || m.hex);
  if (t.r || m.reg) html += ' &nbsp;|&nbsp; <strong>註冊號：</strong>' + (t.r || m.reg);
  if (t.t || m.type) html += ' &nbsp;|&nbsp; <strong>機型：</strong>' + (t.t || m.type);
  if (t.desc || m.desc) html += ' (' + (t.desc || m.desc) + ')';
  html += '<br><strong>原始航點數：</strong>' + t.trace.length;
  html += ' &nbsp;→&nbsp; <strong>偵測航段數：</strong>' + currentLegs.length;
  document.getElementById('flightInfo').innerHTML = html;
}

/* ===== 航段列表 ===== */
function renderLegList() {
  var container = document.getElementById('legList');
  container.innerHTML = '';
  var baseTs = currentTrace.timestamp;

  for (var i = 0; i < currentLegs.length; i++) {
    var leg = currentLegs[i];
    var startPt = leg[0];
    var endPt = leg[leg.length - 1];
    var startTs = baseTs + startPt[0];
    var endTs = baseTs + endPt[0];
    var duration = endPt[0] - startPt[0];
    var cs = getLegCallsign(leg);
    var maxAlt = getLegMaxAlt(leg);

    // 用起點/終點經緯度查時區
    var depTz = lookupTz(startPt[1], startPt[2]);
    var arrTz = lookupTz(endPt[1], endPt[2]);

    var div = document.createElement('div');
    div.className = 'leg-item' + (i === 0 ? ' active' : '');
    div.setAttribute('data-index', i);
    div.onclick = (function(idx) { return function() { selectLeg(idx); }; })(i);

    var title = '航段 ' + (i + 1);
    if (cs) title += ' — ' + cs;

    var meta = '<div class="leg-item-meta">';
    meta += '<div class="local-time">出發：' + fmtTimeLocal(startTs, depTz) + '</div>';
    meta += '<div class="local-time">抵達：' + fmtTimeLocal(endTs, arrTz) + '</div>';
    meta += '<div class="utc-time">UTC：' + fmtTimeUTC(startTs) + ' → ' + fmtTimeUTC(endTs) + '</div>';
    meta += '<div class="leg-stats">歷時 ' + fmtDuration(duration) + ' ｜ ' + leg.length + ' 航點 ｜ 最高 ' + Math.round(maxAlt).toLocaleString() + ' ft</div>';
    meta += '</div>';

    div.innerHTML = '<div class="leg-item-title">' + title + '</div>' + meta;
    container.appendChild(div);
  }
}

function selectLeg(index) {
  selectedLegIndex = index;
  var items = document.querySelectorAll('.leg-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', parseInt(items[i].getAttribute('data-index')) === index);
  }
  renderMap(currentLegs[index]);
}

/* ===== 地圖渲染 ===== */
function renderMap(legPoints) {
  if (!map) {
    map = L.map('map', { zoomControl: true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 18
    }).addTo(map);
  }

  if (trackLayer) { map.removeLayer(trackLayer); trackLayer = null; }
  if (!legPoints || legPoints.length === 0) return;

  var latlngs = legPoints.map(function(p) { return [p[1], p[2]]; });
  trackLayer = L.layerGroup();

  var polyline = L.polyline(latlngs, { color: '#38bdf8', weight: 3, opacity: 0.85 });
  trackLayer.addLayer(polyline);

  var baseTs = currentTrace.timestamp;
  trackLayer.addLayer(
    L.circleMarker(latlngs[0], { radius: 7, color: '#4ade80', fillColor: '#4ade80', fillOpacity: 1 })
     .bindPopup('<b>起點</b><br>' + fmtTimeUTC(baseTs + legPoints[0][0]))
  );
  trackLayer.addLayer(
    L.circleMarker(latlngs[latlngs.length - 1], { radius: 7, color: '#f87171', fillColor: '#f87171', fillOpacity: 1 })
     .bindPopup('<b>終點</b><br>' + fmtTimeUTC(baseTs + legPoints[legPoints.length - 1][0]))
  );

  trackLayer.addTo(map);
  map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
}

/* ===== 產生單航段 KML ===== */
function generateLegKML(legPoints, legIndex) {
  var t = currentTrace;
  var m = currentMeta;
  var useGeom = document.querySelector('input[name="altMode"]:checked').value === 'geom';

  var cs = getLegCallsign(legPoints) || m.callsign || t.icao || 'UNKNOWN';
  var reg = t.r || m.reg || '';
  var acType = t.t || m.type || '';
  var desc = t.desc || m.desc || '';
  var baseTs = t.timestamp;
  var altModeName = useGeom ? '幾何高度 (GPS)' : '氣壓高度';

  var startPt = legPoints[0];
  var endPt = legPoints[legPoints.length - 1];
  var startTs = baseTs + startPt[0];
  var endTs = baseTs + endPt[0];
  var depTz = lookupTz(startPt[1], startPt[2]);
  var arrTz = lookupTz(endPt[1], endPt[2]);

  var whenLines = [];
  var coordLines = [];

  for (var j = 0; j < legPoints.length; j++) {
    var pt = legPoints[j];
    var time = new Date((baseTs + pt[0]) * 1000).toISOString();
    var lat = pt[1];
    var lon = pt[2];
    var altM = getAltM(pt, useGeom);
    whenLines.push('          <when>' + time + '</when>');
    coordLines.push('          <gx:coord>' + lon + ' ' + lat + ' ' + altM.toFixed(1) + '</gx:coord>');
  }

  var nameLine = cs + (reg ? ' (' + reg + ')' : '') + (legIndex !== undefined ? ' [航段' + (legIndex + 1) + ']' : '');

  var kml = '<?xml version="1.0" encoding="UTF-8"?>\n';
  kml += '<kml xmlns="http://www.opengis.net/kml/2.2"\n';
  kml += '     xmlns:gx="http://www.google.com/kml/ext/2.2">\n';
  kml += '<Document>\n';
  kml += '  <name>' + escXml(nameLine) + '</name>\n';
  kml += '  <description>\n';
  kml += '    呼號: ' + escXml(cs) + '\n';
  kml += '    ICAO: ' + escXml(t.icao || m.hex) + '\n';
  if (reg) kml += '    註冊號: ' + escXml(reg) + '\n';
  if (acType) kml += '    機型: ' + escXml(acType) + (desc ? ' (' + escXml(desc) + ')' : '') + '\n';
  kml += '    高度模式: ' + altModeName + '\n';
  kml += '    航點數: ' + legPoints.length + '\n';
  kml += '    出發: ' + fmtTimeLocal(startTs, depTz) + ' (' + depTz + ')\n';
  kml += '    抵達: ' + fmtTimeLocal(endTs, arrTz) + ' (' + arrTz + ')\n';
  kml += '    UTC: ' + fmtTimeUTC(startTs) + ' → ' + fmtTimeUTC(endTs) + '\n';
  kml += '    資料來源: airplanes.live\n';
  kml += '  </description>\n';
  kml += '  <Style id="flightPath"><LineStyle><color>ffff8800</color><width>3</width></LineStyle></Style>\n';
  kml += '  <Style id="startIcon"><IconStyle><color>ff00ff00</color><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/grn-circle.png</href></Icon></IconStyle></Style>\n';
  kml += '  <Style id="endIcon"><IconStyle><color>ff0000ff</color><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/red-circle.png</href></Icon></IconStyle></Style>\n';
  kml += '  <Placemark>\n';
  kml += '    <name>' + escXml(cs) + ' 飛行軌跡</name>\n';
  kml += '    <styleUrl>#flightPath</styleUrl>\n';
  kml += '    <gx:Track>\n';
  kml += '      <altitudeMode>absolute</altitudeMode>\n';
  kml += whenLines.join('\n') + '\n';
  kml += coordLines.join('\n') + '\n';
  kml += '    </gx:Track>\n';
  kml += '  </Placemark>\n';

  var sp = legPoints[0];
  var spAlt = getAltM(sp, useGeom);
  kml += '  <Placemark><name>起點</name><description>' + fmtTimeLocal(startTs, depTz) + '</description><styleUrl>#startIcon</styleUrl>';
  kml += '<Point><altitudeMode>absolute</altitudeMode><coordinates>' + sp[2] + ',' + sp[1] + ',' + spAlt.toFixed(1) + '</coordinates></Point></Placemark>\n';

  var ep = legPoints[legPoints.length - 1];
  var epAlt = getAltM(ep, useGeom);
  kml += '  <Placemark><name>終點</name><description>' + fmtTimeLocal(endTs, arrTz) + '</description><styleUrl>#endIcon</styleUrl>';
  kml += '<Point><altitudeMode>absolute</altitudeMode><coordinates>' + ep[2] + ',' + ep[1] + ',' + epAlt.toFixed(1) + '</coordinates></Point></Placemark>\n';

  kml += '</Document>\n</kml>';
  return kml;
}

function escXml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ===== 下載 ===== */
function downloadKML() {
  if (!currentLegs || currentLegs.length === 0) { setStatus('請先搜尋並載入軌跡', 'error'); return; }
  var leg = currentLegs[selectedLegIndex];
  var kml = generateLegKML(leg, selectedLegIndex);
  var cs = getLegCallsign(leg) || currentMeta.callsign || currentTrace.icao || 'flight';
  var baseTs = currentTrace.timestamp;
  var dateStr = new Date((baseTs + leg[0][0]) * 1000).toISOString().slice(0, 10);
  var altMode = document.querySelector('input[name="altMode"]:checked').value;
  var filename = cs + '_' + dateStr + '_leg' + (selectedLegIndex + 1) + '_' + altMode + '.kml';
  triggerDownload(filename, kml);
  setStatus('已下載 ' + filename, 'ok');
}

function downloadAllKML() {
  if (!currentLegs || currentLegs.length === 0) { setStatus('請先搜尋並載入軌跡', 'error'); return; }
  for (var i = 0; i < currentLegs.length; i++) {
    var leg = currentLegs[i];
    var kml = generateLegKML(leg, i);
    var cs = getLegCallsign(leg) || currentMeta.callsign || currentTrace.icao || 'flight';
    var baseTs = currentTrace.timestamp;
    var dateStr = new Date((baseTs + leg[0][0]) * 1000).toISOString().slice(0, 10);
    var altMode = document.querySelector('input[name="altMode"]:checked').value;
    var filename = cs + '_' + dateStr + '_leg' + (i + 1) + '_' + altMode + '.kml';
    triggerDownload(filename, kml);
  }
  setStatus('已下載全部 ' + currentLegs.length + ' 個航段', 'ok');
}

function triggerDownload(filename, content) {
  var blob = new Blob([content], { type: 'application/vnd.google-earth.kml+xml' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===== 初始化 ===== */
window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('queryValue').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') searchAircraft();
  });

  var params = new URLSearchParams(window.location.search);
  if (params.get('icao')) {
    document.getElementById('queryType').value = 'hex';
    document.getElementById('queryValue').value = params.get('icao');
    searchAircraft();
  } else if (params.get('callsign')) {
    document.getElementById('queryType').value = 'callsign';
    document.getElementById('queryValue').value = params.get('callsign');
    searchAircraft();
  } else if (params.get('reg')) {
    document.getElementById('queryType').value = 'reg';
    document.getElementById('queryValue').value = params.get('reg');
    searchAircraft();
  }
});
</script>
