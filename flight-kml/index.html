<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈ Flight Path to KML</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --accent: #38bdf8;
    --accent-hover: #7dd3fc;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --success: #4ade80;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 1rem;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header { text-align: center; padding: 1.5rem 0 1rem; }
  header h1 { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  header p { color: var(--text-dim); font-size: 0.85rem; margin-top: 0.3rem; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
  }
  .card-title {
    font-size: 0.95rem; font-weight: 600; color: var(--accent);
    margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem;
  }

  .notice {
    background: #1a1a2e; border-left: 3px solid var(--warn);
    padding: 0.75rem 1rem; border-radius: 0 8px 8px 0;
    margin-bottom: 1rem; font-size: 0.82rem; color: var(--warn); line-height: 1.6;
  }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; }
  input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 0.55rem 0.75rem; border-radius: 8px; font-size: 0.9rem; outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #475569; }

  button {
    padding: 0.6rem 1.2rem; border: none; border-radius: 8px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-success { background: var(--success); color: var(--bg); }
  .btn-success:hover:not(:disabled) { background: #86efac; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }

  #status {
    margin-top: 0.75rem; font-size: 0.82rem; min-height: 1.2rem; color: var(--text-dim);
  }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--success); }
  #status.loading { color: var(--warn); }

  .flight-list {
    display: flex; flex-direction: column; gap: 0.5rem;
    max-height: 260px; overflow-y: auto;
  }
  .flight-item {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.75rem 1rem; display: flex; justify-content: space-between;
    align-items: center; gap: 0.75rem; flex-wrap: wrap; transition: border-color 0.2s;
  }
  .flight-item:hover { border-color: var(--accent); }
  .flight-info { flex: 1; min-width: 200px; }
  .flight-callsign { font-weight: 700; font-size: 1rem; color: var(--accent); }
  .flight-meta { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.2rem; }
  .flight-item button { font-size: 0.8rem; padding: 0.4rem 0.8rem; flex-shrink: 0; }

  #map {
    height: 400px; border-radius: 8px; border: 1px solid var(--border); background: #0c1222;
  }
  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    #map { height: 300px; }
    .flight-item { flex-direction: column; align-items: flex-start; }
  }
  .leaflet-container { background: #0c1222 !important; }
  .flight-list::-webkit-scrollbar { width: 6px; }
  .flight-list::-webkit-scrollbar-track { background: transparent; }
  .flight-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>✈ Flight Path to KML</h1>
    <p>查詢航班軌跡，預覽並匯出為 KML 檔案</p>
  </header>

  <!-- 注意事項 -->
  <div class="notice">
    ⚠ 歷史資料僅可查詢 <strong>30 天內</strong> 的航班軌跡（OpenSky Network 限制）。<br>
    ⚠ 出發機場需填寫 <strong>ICAO 代碼</strong>（4 碼），例如：RCTP（桃園）、RJTT（東京羽田）、EGLL（倫敦希斯洛）、KJFK（紐約乘迺迪）。
  </div>

  <!-- 查詢表單 -->
  <div class="card">
    <div class="card-title">🔍 查詢航班</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="callsign">航班呼號 (Callsign)</label>
        <input type="text" id="callsign" placeholder="例: CAL123、DLH456">
      </div>
      <div class="form-group">
        <label for="date">日期</label>
        <input type="date" id="date">
      </div>
      <div class="form-group">
        <label for="airport">出發機場 (ICAO Code)</label>
        <input type="text" id="airport" placeholder="例: RCTP、RJTT" maxlength="4">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btnSearch" onclick="searchFlights()">🔍 搜尋航班</button>
    </div>
    <div id="status"></div>
  </div>

  <!-- 搜尋結果 -->
  <div class="card hidden" id="resultsCard">
    <div class="card-title">📋 搜尋結果</div>
    <div class="flight-list" id="flightList"></div>
  </div>

  <!-- 地圖 + 下載 -->
  <div class="card hidden" id="mapCard">
    <div class="card-title">🗺 航班軌跡</div>
    <div id="map"></div>
    <div class="btn-row">
      <button class="btn-success" id="btnDownload" onclick="downloadKML()">📥 下載 KML</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// API 代理路徑（同網域，由 Cloudflare Pages Function 處理）
// 例如 /api/flights/departure?airport=RCTP&begin=...
// ============================================================
const API_BASE = '/api';

let currentTrack = null;
let currentFlight = null;
let map = null;
let trackLayer = null;

// ============================================================
// UI 輔助
// ============================================================
function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type;
}

function initDateInput() {
  const dateInput = document.getElementById('date');
  const today = new Date();
  const minDate = new Date(today);
  minDate.setDate(minDate.getDate() - 30);
  dateInput.value = today.toISOString().slice(0, 10);
  dateInput.max = today.toISOString().slice(0, 10);
  dateInput.min = minDate.toISOString().slice(0, 10);
}

async function apiFetch(path) {
  const resp = await fetch(`${API_BASE}${path}`);
  if (resp.status === 404) return null;
  if (!resp.ok) {
    const text = await resp.text();
    let msg;
    try { msg = JSON.parse(text).error; } catch { msg = text.slice(0, 200); }
    throw new Error(`API 錯誤 (${resp.status}): ${msg}`);
  }
  return resp.json();
}

// ============================================================
// 步驟 1：搜尋航班
// ============================================================
async function searchFlights() {
  const callsignInput = document.getElementById('callsign').value.trim().toUpperCase();
  const dateStr = document.getElementById('date').value;
  const airport = document.getElementById('airport').value.trim().toUpperCase();

  if (!callsignInput) { setStatus('請輸入航班呼號', 'error'); return; }
  if (!dateStr)        { setStatus('請選擇日期', 'error'); return; }
  if (!airport || airport.length !== 4) { setStatus('請輸入 4 碼 ICAO 機場代碼', 'error'); return; }

  const dayStart = new Date(dateStr + 'T00:00:00Z');
  const dayEnd = new Date(dayStart);
  dayEnd.setUTCDate(dayEnd.getUTCDate() + 2);
  const begin = Math.floor(dayStart.getTime() / 1000);
  const end   = Math.floor(dayEnd.getTime() / 1000);

  setStatus('正在查詢航班…（可能需要數秒）', 'loading');
  document.getElementById('btnSearch').disabled = true;

  try {
    const flights = await apiFetch(
      `/flights/departure?airport=${airport}&begin=${begin}&end=${end}`
    );

    if (!flights || flights.length === 0) {
      setStatus(`在 ${dateStr} 未找到從 ${airport} 出發的航班。`, 'error');
      document.getElementById('resultsCard').classList.add('hidden');
      document.getElementById('btnSearch').disabled = false;
      return;
    }

    // 比對 callsign（支援部分匹配）
    const matched = flights.filter(f => {
      const cs = (f.callsign || '').trim().toUpperCase();
      return cs.includes(callsignInput) || callsignInput.includes(cs);
    });

    if (matched.length === 0) {
      setStatus(
        `未找到呼號含「${callsignInput}」的航班。以下列出該機場該日所有 ${flights.length} 筆航班供參考。`,
        'error'
      );
      renderFlightList(flights);
    } else {
      setStatus(`找到 ${matched.length} 筆符合的航班`, 'ok');
      renderFlightList(matched);
    }
  } catch (err) {
    setStatus(err.message, 'error');
  }

  document.getElementById('btnSearch').disabled = false;
}

function renderFlightList(flights) {
  const container = document.getElementById('flightList');
  container.innerHTML = '';

  flights.forEach(f => {
    const cs  = (f.callsign || '(無呼號)').trim();
    const dep = f.estDepartureAirport || '???';
    const arr = f.estArrivalAirport   || '???';
    const t1  = f.firstSeen ? new Date(f.firstSeen * 1000).toUTCString().slice(5, 22) : '?';
    const t2  = f.lastSeen  ? new Date(f.lastSeen  * 1000).toUTCString().slice(5, 22) : '?';

    const div = document.createElement('div');
    div.className = 'flight-item';
    div.innerHTML = `
      <div class="flight-info">
        <div class="flight-callsign">${cs}</div>
        <div class="flight-meta">
          ICAO24: ${f.icao24} &nbsp;|&nbsp; ${dep} → ${arr}<br>
          ${t1} — ${t2} (UTC)
        </div>
      </div>
      <button class="btn-primary" onclick='loadTrack(${JSON.stringify(f).replace(/'/g, "&#39;")})'>📡 載入軌跡</button>
    `;
    container.appendChild(div);
  });

  document.getElementById('resultsCard').classList.remove('hidden');
}

// ============================================================
// 步驟 2：載入軌跡
// ============================================================
async function loadTrack(flight) {
  const icao24 = flight.icao24;
  const time = flight.firstSeen || 0;

  setStatus('正在載入軌跡…', 'loading');

  try {
    const track = await apiFetch(`/tracks/all?icao24=${icao24}&time=${time}`);

    if (!track || !track.path || track.path.length === 0) {
      setStatus('此航班無可用軌跡資料（tracks 端點為實驗性質，部分航班可能無資料）。', 'error');
      return;
    }

    currentTrack = track;
    currentFlight = flight;
    setStatus(`已載入軌跡：${track.path.length} 個航點`, 'ok');
    renderMap(track);
    document.getElementById('mapCard').classList.remove('hidden');
  } catch (err) {
    setStatus(err.message, 'error');
  }
}

// ============================================================
// 地圖
// ============================================================
function renderMap(track) {
  if (!map) {
    map = L.map('map', { zoomControl: true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18,
    }).addTo(map);
  }

  if (trackLayer) { map.removeLayer(trackLayer); trackLayer = null; }

  const validPts = track.path.filter(p => p[1] != null && p[2] != null);
  if (validPts.length === 0) return;

  const latlngs = validPts.map(p => [p[1], p[2]]);
  trackLayer = L.layerGroup();

  const polyline = L.polyline(latlngs, { color: '#38bdf8', weight: 3, opacity: 0.85 });
  trackLayer.addLayer(polyline);

  const startM = L.circleMarker(latlngs[0], {
    radius: 7, color: '#4ade80', fillColor: '#4ade80', fillOpacity: 1,
  }).bindPopup(`<b>起點</b><br>${new Date(validPts[0][0] * 1000).toUTCString()}`);
  trackLayer.addLayer(startM);

  const endM = L.circleMarker(latlngs[latlngs.length - 1], {
    radius: 7, color: '#f87171', fillColor: '#f87171', fillOpacity: 1,
  }).bindPopup(`<b>終點</b><br>${new Date(validPts[validPts.length - 1][0] * 1000).toUTCString()}`);
  trackLayer.addLayer(endM);

  trackLayer.addTo(map);
  map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
  setTimeout(() => map.invalidateSize(), 200);
}

// ============================================================
// 步驟 3：KML 生成 & 下載
// ============================================================
function generateKML(track, flight) {
  const cs  = (track.callsign || flight.callsign || 'UNKNOWN').trim();
  const dep = flight.estDepartureAirport || '???';
  const arr = flight.estArrivalAirport   || '???';
  const startUTC = new Date(track.startTime * 1000).toISOString();
  const endUTC   = new Date(track.endTime   * 1000).toISOString();

  const validPts = track.path.filter(p => p[1] != null && p[2] != null);

  const coordinates = validPts.map(p => {
    const alt = p[3] != null ? p[3] : 0;
    return `${p[2]},${p[1]},${alt}`;
  }).join('\n            ');

  const sp = validPts[0];
  const ep = validPts[validPts.length - 1];

  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${cs} - ${dep} → ${arr}</name>
    <description>
航班呼號: ${cs}
ICAO24: ${track.icao24}
出發機場: ${dep}
抵達機場: ${arr}
起飛時間: ${startUTC}
降落時間: ${endUTC}
航點數量: ${validPts.length}
資料來源: OpenSky Network
    </description>

    <Style id="flightPath">
      <LineStyle><color>ffff8800</color><width>3</width></LineStyle>
    </Style>
    <Style id="startPoint">
      <IconStyle><color>ff00ff00</color><scale>1.2</scale>
        <Icon><href>http://maps.google.com/mapfiles/kml/paddle/grn-circle.png</href></Icon>
      </IconStyle>
    </Style>
    <Style id="endPoint">
      <IconStyle><color>ff0000ff</color><scale>1.2</scale>
        <Icon><href>http://maps.google.com/mapfiles/kml/paddle/red-circle.png</href></Icon>
      </IconStyle>
    </Style>

    <Placemark>
      <name>${cs} 飛行路徑</name>
      <styleUrl>#flightPath</styleUrl>
      <LineString>
        <extrude>1</extrude>
        <tessellate>1</tessellate>
        <altitudeMode>absolute</altitudeMode>
        <coordinates>
            ${coordinates}
        </coordinates>
      </LineString>
    </Placemark>

    <Placemark>
      <name>起點 - ${dep}</name>
      <description>起飛: ${startUTC}</description>
      <styleUrl>#startPoint</styleUrl>
      <Point>
        <altitudeMode>absolute</altitudeMode>
        <coordinates>${sp[2]},${sp[1]},${sp[3] || 0}</coordinates>
      </Point>
    </Placemark>

    <Placemark>
      <name>終點 - ${arr}</name>
      <description>降落: ${endUTC}</description>
      <styleUrl>#endPoint</styleUrl>
      <Point>
        <altitudeMode>absolute</altitudeMode>
        <coordinates>${ep[2]},${ep[1]},${ep[3] || 0}</coordinates>
      </Point>
    </Placemark>

  </Document>
</kml>`;
}

function downloadKML() {
  if (!currentTrack || !currentFlight) { setStatus('請先載入軌跡', 'error'); return; }

  const kml = generateKML(currentTrack, currentFlight);
  const cs = (currentTrack.callsign || currentFlight.callsign || 'flight').trim();
  const dateStr = new Date(currentTrack.startTime * 1000).toISOString().slice(0, 10);
  const filename = `${cs}_${dateStr}.kml`;

  const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus(`已下載 ${filename}`, 'ok');
}

// ============================================================
// 初始化
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  initDateInput();
  ['callsign', 'airport'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') searchFlights();
    });
  });
  document.getElementById('airport').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase();
  });
});
</script>

</body>
</html>
