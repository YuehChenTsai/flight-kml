<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈ Flight Path to KML</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --accent: #38bdf8; --accent-hover: #7dd3fc;
    --text: #e2e8f0; --text-dim: #94a3b8;
    --success: #4ade80; --warn: #fbbf24; --danger: #f87171;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 1rem;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header { text-align: center; padding: 1.5rem 0 1rem; }
  header h1 { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  header p { color: var(--text-dim); font-size: 0.85rem; margin-top: 0.3rem; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
  }
  .card-title {
    font-size: 0.95rem; font-weight: 600; color: var(--accent);
    margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem;
  }
  .notice {
    background: #1a1a2e; border-left: 3px solid var(--warn);
    padding: 0.75rem 1rem; border-radius: 0 8px 8px 0;
    margin-bottom: 1rem; font-size: 0.82rem; color: var(--warn); line-height: 1.6;
  }
  .notice.info { border-left-color: var(--accent); color: var(--accent); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
  label { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; }
  input, select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 0.55rem 0.75rem; border-radius: 8px; font-size: 0.9rem; outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: #475569; }

  button {
    padding: 0.6rem 1.2rem; border: none; border-radius: 8px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-success { background: var(--success); color: var(--bg); }
  .btn-success:hover:not(:disabled) { background: #86efac; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }

  #status { margin-top: 0.75rem; font-size: 0.82rem; min-height: 1.2rem; color: var(--text-dim); }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--success); }
  #status.loading { color: var(--warn); }

  #map {
    height: 420px; border-radius: 8px; border: 1px solid var(--border); background: #0c1222;
  }
  .hidden { display: none !important; }
  .flight-info-box {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.75rem 1rem; margin-bottom: 0.75rem; font-size: 0.85rem; line-height: 1.7;
  }
  .flight-info-box span { color: var(--accent); font-weight: 600; }

  .alt-selector { margin-top: 0.75rem; font-size: 0.85rem; }
  .alt-selector label { margin-right: 1rem; cursor: pointer; }
  .alt-selector input[type=radio] { margin-right: 0.3rem; accent-color: var(--accent); }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    #map { height: 300px; }
  }
  .leaflet-container { background: #0c1222 !important; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>✈ Flight Path to KML</h1>
    <p>即時查詢航班軌跡，預覽並匯出為 KML 檔案</p>
  </header>

  <div class="notice info">
    ℹ 資料來源為 <strong>adsb.fi</strong> 社群即時 ADS-B 資料。可查詢<strong>目前正在飛行中</strong>或<strong>最近數小時內</strong>的航班軌跡。
  </div>
  <div class="notice">
    ⚠ 輸入 ICAO Hex 代碼（如 <strong>8991be</strong>）、航班呼號（如 <strong>CAL130</strong>）或機身註冊號（如 <strong>B-18317</strong>）。<br>
    ⚠ 不確定代碼？到 <a href="https://globe.adsb.fi" target="_blank" style="color:var(--accent);">globe.adsb.fi</a> 點選飛機即可看到 hex 碼。
  </div>

  <!-- 查詢 -->
  <div class="card">
    <div class="card-title">🔍 查詢航班</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="queryType">查詢方式</label>
        <select id="queryType">
          <option value="hex">ICAO Hex (如 8991be)</option>
          <option value="callsign">航班呼號 (如 CAL130)</option>
          <option value="reg">機身註冊號 (如 B-18317)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="queryValue">查詢值</label>
        <input type="text" id="queryValue" placeholder="輸入代碼…">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btnSearch" onclick="searchAircraft()">🔍 搜尋航班</button>
    </div>
    <div id="status"></div>
  </div>

  <!-- 結果 -->
  <div class="card hidden" id="resultCard">
    <div class="card-title">📡 航班資訊</div>
    <div class="flight-info-box" id="flightInfo"></div>

    <div class="card-title">🗺 航班軌跡</div>
    <div id="map"></div>

    <div class="alt-selector">
      <strong>KML 高度模式：</strong>
      <label><input type="radio" name="altMode" value="geom" checked> 幾何高度 (GPS/WGS84)</label>
      <label><input type="radio" name="altMode" value="baro"> 氣壓高度</label>
    </div>
    <div class="btn-row">
      <button class="btn-success" id="btnDownload" onclick="downloadKML()">📥 下載 KML</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// API 端點
// opendata.adsb.fi — 有 CORS，直接呼叫
// /api/traces/...   — 透過我們的 Worker 代理 globe.adsb.fi
// ============================================================
const ADSB_FI_API = 'https://opendata.adsb.fi/api';
const TRACE_PROXY = '/api/traces';

let currentTrace = null;
let currentMeta = null;
let map = null;
let trackLayer = null;

function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type;
}

// ============================================================
// 步驟 1：用 opendata.adsb.fi 查詢飛機 → 取得 hex
// ============================================================
async function searchAircraft() {
  const qType = document.getElementById('queryType').value;
  const qVal  = document.getElementById('queryValue').value.trim();
  if (!qVal) { setStatus('請輸入查詢值', 'error'); return; }

  setStatus('正在搜尋航班…', 'loading');
  document.getElementById('btnSearch').disabled = true;
  document.getElementById('resultCard').classList.add('hidden');

  try {
    let url;
    if (qType === 'hex')      url = `${ADSB_FI_API}/v2/hex/${qVal}`;
    if (qType === 'callsign') url = `${ADSB_FI_API}/v2/callsign/${qVal}`;
    if (qType === 'reg')      url = `${ADSB_FI_API}/v2/registration/${qVal}`;

    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`adsb.fi API 錯誤 (${resp.status})`);
    const data = await resp.json();

    if (!data.ac || data.ac.length === 0) {
      setStatus('未找到此航班。請確認代碼正確，且飛機目前正在被追蹤中。', 'error');
      document.getElementById('btnSearch').disabled = false;
      return;
    }

    const ac = data.ac[0];
    currentMeta = ac;
    setStatus(`找到飛機 ${ac.hex.toUpperCase()}（${(ac.flight||'').trim() || ac.r || ''}），正在載入軌跡…`, 'loading');

    await loadTrace(ac.hex);
  } catch (err) {
    setStatus('搜尋失敗：' + err.message, 'error');
  }
  document.getElementById('btnSearch').disabled = false;
}

// ============================================================
// 步驟 2：透過 Worker 代理載入 trace
// ============================================================
async function loadTrace(hex) {
  const suffix = hex.slice(-2).toLowerCase();
  const hexLower = hex.toLowerCase();

  let trace = null;
  for (const type of ['trace_full', 'trace_recent']) {
    const url = `${TRACE_PROXY}/${suffix}/${type}_${hexLower}.json`;
    try {
      const resp = await fetch(url);
      if (resp.ok) {
        const text = await resp.text();
        if (text && text.length > 10 && text.trimStart().startsWith('{')) {
          trace = JSON.parse(text);
          if (trace.trace && trace.trace.length > 0) break;
        }
      }
    } catch (e) { /* 嘗試下一個 */ }
  }

  if (!trace || !trace.trace || trace.trace.length === 0) {
    setStatus('無法取得軌跡資料。飛機可能剛出現，尚無足夠航跡。', 'error');
    return;
  }

  currentTrace = trace;
  const pts = trace.trace.filter(p => p[1] != null && p[2] != null);
  setStatus(`已載入軌跡：${pts.length} 個航點`, 'ok');

  renderFlightInfo(trace);
  renderMap(trace);
  document.getElementById('resultCard').classList.remove('hidden');
}

// ============================================================
// 航班資訊
// ============================================================
function renderFlightInfo(trace) {
  const ac = currentMeta || {};
  // 從 trace 的詳細物件中找 callsign
  let callsign = (ac.flight || '').trim();
  if (!callsign) {
    for (const p of trace.trace) {
      if (p[7] && typeof p[7] === 'object' && p[7].flight) {
        callsign = p[7].flight.trim();
        break;
      }
    }
  }
  const reg  = trace.r || ac.r || '';
  const type = trace.t || ac.t || '';
  const desc = trace.desc || ac.desc || '';

  const pts = trace.trace.filter(p => p[1] != null && p[2] != null);
  const t1 = new Date((trace.timestamp + (pts[0]?.[0] || 0)) * 1000);
  const t2 = new Date((trace.timestamp + (pts[pts.length - 1]?.[0] || 0)) * 1000);

  document.getElementById('flightInfo').innerHTML =
    `<span>ICAO:</span> ${trace.icao.toUpperCase()} &nbsp;|&nbsp;` +
    `<span>呼號:</span> ${callsign || 'N/A'} &nbsp;|&nbsp;` +
    `<span>註冊號:</span> ${reg || 'N/A'} &nbsp;|&nbsp;` +
    `<span>機型:</span> ${type} ${desc ? '(' + desc + ')' : ''}<br>` +
    `<span>軌跡:</span> ${t1.toUTCString().slice(5, 22)} — ${t2.toUTCString().slice(5, 22)} UTC &nbsp;|&nbsp;` +
    `<span>航點:</span> ${pts.length}`;
}

// ============================================================
// 地圖
// ============================================================
function renderMap(trace) {
  if (!map) {
    map = L.map('map');
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OSM &copy; CARTO', maxZoom: 18,
    }).addTo(map);
  }
  if (trackLayer) { map.removeLayer(trackLayer); }
  trackLayer = L.layerGroup();

  const pts = trace.trace.filter(p => p[1] != null && p[2] != null);
  if (!pts.length) return;

  const latlngs = pts.map(p => [p[1], p[2]]);
  const line = L.polyline(latlngs, { color: '#38bdf8', weight: 3, opacity: 0.85 });
  trackLayer.addLayer(line);

  trackLayer.addLayer(
    L.circleMarker(latlngs[0], { radius: 7, color: '#4ade80', fillColor: '#4ade80', fillOpacity: 1 })
     .bindPopup(`<b>起點</b><br>${new Date((trace.timestamp + pts[0][0]) * 1000).toUTCString()}`)
  );
  trackLayer.addLayer(
    L.circleMarker(latlngs[latlngs.length - 1], { radius: 7, color: '#f87171', fillColor: '#f87171', fillOpacity: 1 })
     .bindPopup(`<b>最新位置</b><br>${new Date((trace.timestamp + pts[pts.length - 1][0]) * 1000).toUTCString()}`)
  );

  trackLayer.addTo(map);
  map.fitBounds(line.getBounds(), { padding: [30, 30] });
  setTimeout(() => map.invalidateSize(), 200);
}

// ============================================================
// KML 生成 & 下載
// ============================================================
function generateKML(trace) {
  const useGeom = document.querySelector('input[name="altMode"]:checked').value === 'geom';
  const ac = currentMeta || {};
  const callsign = (ac.flight || '').trim();
  const reg  = trace.r || ac.r || '';
  const type = trace.t || ac.t || '';
  const desc = trace.desc || ac.desc || '';
  const hex  = trace.icao;
  const baseTs = trace.timestamp;

  const pts = trace.trace.filter(p => p[1] != null && p[2] != null);
  const whens = [];
  const coords = [];

  for (const p of pts) {
    whens.push(`      <when>${new Date((baseTs + p[0]) * 1000).toISOString()}</when>`);
    let altFt;
    if (p[3] === 'ground' || p[3] == null) altFt = 0;
    else if (useGeom && p[10] != null) altFt = p[10];
    else altFt = (typeof p[3] === 'number') ? p[3] : 0;
    coords.push(`      <gx:coord>${p[2]} ${p[1]} ${Math.round(altFt * 0.3048)}</gx:coord>`);
  }

  const altLabel = useGeom ? 'Geometric (WGS84)' : 'Barometric';
  const t1 = new Date((baseTs + pts[0][0]) * 1000).toISOString();
  const t2 = new Date((baseTs + pts[pts.length - 1][0]) * 1000).toISOString();

  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"
     xmlns:gx="http://www.google.com/kml/ext/2.2">
  <Document>
    <name>${callsign || hex} - ${reg || 'Unknown'}</name>
    <description>
ICAO Hex: ${hex}
Callsign: ${callsign || 'N/A'}
Registration: ${reg || 'N/A'}
Type: ${type} ${desc}
Altitude: ${altLabel}
Start: ${t1}
End: ${t2}
Points: ${pts.length}
Source: adsb.fi
    </description>
    <Style id="flightPath">
      <LineStyle><color>ffff8800</color><width>3</width></LineStyle>
      <IconStyle>
        <Icon><href>http://maps.google.com/mapfiles/kml/shapes/airports.png</href></Icon>
      </IconStyle>
    </Style>
    <Folder>
      <name>${(reg || hex).toUpperCase()} track</name>
      <Placemark>
        <name>${(reg || callsign || hex).toUpperCase()}</name>
        <styleUrl>#flightPath</styleUrl>
        <gx:Track>
          <altitudeMode>absolute</altitudeMode>
          <extrude>1</extrude>
${whens.join('\n')}
${coords.join('\n')}
        </gx:Track>
      </Placemark>
    </Folder>
  </Document>
</kml>`;
}

function downloadKML() {
  if (!currentTrace) { setStatus('請先搜尋並載入軌跡', 'error'); return; }
  const kml = generateKML(currentTrace);

  const ac = currentMeta || {};
  const reg = currentTrace.r || ac.r || '';
  const cs  = (ac.flight || '').trim();
  const hex = currentTrace.icao;
  const alt = document.querySelector('input[name="altMode"]:checked').value === 'geom' ? 'WGS84' : 'baro';
  const pts = currentTrace.trace.filter(p => p[1] != null);
  const date = new Date((currentTrace.timestamp + pts[0][0]) * 1000).toISOString().slice(0, 10);
  const name = (reg || cs || hex).replace(/\s+/g, '');
  const filename = `${name}_${date}_${alt}.kml`;

  const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  setStatus(`已下載 ${filename}`, 'ok');
}

// ============================================================
// 初始化
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('queryValue').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchAircraft();
  });
  const params = new URLSearchParams(location.search);
  for (const [k, v] of [['icao','hex'],['callsign','callsign'],['reg','reg']]) {
    if (params.get(k)) {
      document.getElementById('queryType').value = v;
      document.getElementById('queryValue').value = params.get(k);
      searchAircraft();
      break;
    }
  }
});
</script>
</body>
</html>
